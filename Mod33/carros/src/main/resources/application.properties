server.port=8086
spring.application.name=carros

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:carrosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console - Configuração para Spring Boot 4.x
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Inicializar banco de dados com data.sql
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Para evitar conflitos com JPA ddl-auto
spring.jpa.defer-datasource-initialization=true