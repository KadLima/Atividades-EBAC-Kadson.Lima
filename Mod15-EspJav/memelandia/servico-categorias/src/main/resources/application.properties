server.port=8082
spring.application.name=servico-categorias

spring.datasource.url=jdbc:h2:mem:db-categorias
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.observations.key-values.application=${spring.application.name}

# URL do serviço de usuários para validação
servicos.usuarios.url=http://localhost:8081

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n
logging.level.br.com.ebac=DEBUG
logging.level.org.springframework.web=INFO
